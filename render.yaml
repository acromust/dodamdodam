# 렌더 설정. 비밀 값(키)은 여기 적지 않고 렌더 화면에서 직접 넣는다(sync: false).
services:
  - type: web
    name: dodamdodam
    runtime: docker
    plan: free
    rootDir: server
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: TZ
        value: Asia/Seoul
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: CAR_KEY
        sync: false
      - key: VAPID_PRIVATE
        sync: false
      - key: VAPID_PUBLIC
        sync: false
